<?xml version="1.0" encoding="UTF-8"?>
<!-- Lean Into It app icon: the turnstile (⊢, "from these facts, this goal")
     leaning forward on an indigo tile, with a teal fact dot on its upright
     and an amber goal dot where its arm ends, in the app's palette
     (web/src/index.css: accent, fact, goal). Flat shapes only; sips
     rasterizes via CoreGraphics' basic SVG support, so no filters, no text.
     Rendered to icon-1024.png by render-icon.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- ground -->
    <rect x="0" y="0" width="1024" height="1024" fill="#4338ca"/>
    <!-- a darker band along the bottom, the ground the proof stands on -->
    <rect x="0" y="820" width="1024" height="204" fill="#3a30b3"/>
    <!-- the turnstile, leaning into it -->
    <g transform="translate(512 512) rotate(14)">
      <rect x="-232" y="-300" width="92" height="600" rx="46" ry="46" fill="#ffffff"/>
      <rect x="-232" y="-46" width="470" height="92" rx="46" ry="46" fill="#ffffff"/>
      <!-- the goal, where the arm points -->
      <circle cx="262" cy="0" r="108" fill="#4338ca"/>
      <circle cx="262" cy="0" r="84" fill="#ecc277"/>
      <!-- a fact, on the upright -->
      <circle cx="-186" cy="-254" r="26" fill="#8fcfc6"/>
      <circle cx="-186" cy="254" r="26" fill="#8fcfc6"/>
    </g>
  </g>
</svg>
