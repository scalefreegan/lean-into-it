name = "lean_into_it"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanIntoIt"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false # Mathlib's style linters judge spacing; a learner's proof is not a Mathlib PR
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "LeanIntoIt"
